[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paxiom-receipts"
version = "0.1.3"
description = "Zero-dependency Python issuer, verifier, x402 buyer preflight/live client, and FastAPI/ASGI middleware for paxiom.receipt.v0."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["x402", "receipts", "ed25519", "agent-payments", "mcp", "fastapi", "paxiom"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.Optional-Dependencies]
fast = ["cryptography>=41.0.0"]

[project.urls]
Homepage = "https://paxiom.org/receipts.html"
Documentation = "https://paxiom.org/api.html"
Repository = "https://github.com/k-luecke/paxiom-static"

[tool.setuptools.packages.find]
where = ["."]
include = ["paxiom_receipts*"]
