<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.6;
  min-height: 100vh; display: flex; flex-direction: column;

}
.paxiom-bar {
  background: rgba(245, 241, 232, 0.92);
  border-bottom: 1px solid var(--rule-faint);
}
.paxiom-bar-inner {
  max-width: 1200px; margin: 0 auto; padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.paxiom-bar-mark {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
}
.paxiom-bar-mark svg { width: 22px; height: 22px; display: block; }
.paxiom-bar-nav {
  display: flex; gap: 18px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
}
.paxiom-bar-nav a { color: var(--ink-mid); text-decoration: none; }
.paxiom-bar-nav a:hover { color: var(--ink); }
main {
  flex: 1; display: grid; place-items: center; padding: 48px 18px;
}
.card {
  width: min(640px, 100%); border: 1.5px solid var(--ink); border-radius: 8px;
  padding: 28px 26px; background: var(--paper);
}
.kicker {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--red); margin-bottom: 10px;
}
h1 {
  font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-weight: 500;
  font-size: clamp(30px, 5vw, 44px); line-height: 1.08; margin-bottom: 12px;
}
p { color: var(--ink-mid); font-size: 16px; margin-bottom: 20px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-block; padding: 9px 16px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  text-decoration: none; border-radius: 8px;
  border: 1.5px solid var(--ink); color: var(--ink);
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn:hover { background: var(--blue); border-color: var(--blue); color: var(--paper); }
